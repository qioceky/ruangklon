name: build-ruangklon

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: "Install SDK packages (BlackBox compileSdk 35, NDK 29.0.13846066)"
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle', 'Bcore/build.gradle') }}

      # RuangKlon v0.2.0: keystore tetap (JKS) dari secret. Tanpa ini,
      # tiap runner membuat debug.keystore acak dan update tidak bisa menimpa.
      - name: Pulihkan keystore tetap dari secret
        env:
          RUANGKLON_KEYSTORE_BASE64: ${{ secrets.RUANGKLON_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RUANGKLON_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret RUANGKLON_KEYSTORE_BASE64 belum diisi — build akan bertanda tangan acak."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$RUANGKLON_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/ruangklon.keystore"
          test -s "$HOME/.android/ruangklon.keystore"
          echo "RUANGKLON_STORE_FILE=$HOME/.android/ruangklon.keystore" >> "$GITHUB_ENV"
          echo "Keystore tetap dipulihkan ($(stat -c%s "$HOME/.android/ruangklon.keystore") byte)."

      - name: Build debug APK (arm64 + armeabi-v7a + universal)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Ringkasan APK
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          APK=$(find app/build/outputs/apk -name "*universal*.apk" | head -1)
          if [ -n "$APK" ]; then
            echo "Universal APK: $APK"
            sha256sum "$APK"
            APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
            "$APKSIGNER" verify --print-certs "$APK" | grep -i "SHA-256" || true
            ${ANDROID_HOME}/build-tools/35.0.0/aapt2 dump badging "$APK" 2>/dev/null | head -20 || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ruangklon-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
